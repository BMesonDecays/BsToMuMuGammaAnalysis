# mmg analysis on the v3 tables (convert_v3.yaml). Everything not set here comes from analysis.yaml.
base: analysis.yaml

parquet: /eos/user/s/sslawins/bmmg/parquet_v3
output: /eos/user/s/sslawins/bmmg/results/v3_mmg

# The v3 data tables of 2026-11-23 hold 96.69% of the processed events of the complete v1 conversion
# (ParkingDoubleMuonLowMass0 not finished: 407 of ~476 files): good luminosity 34650 x 0.9669.
# Update after converting the remaining files (meta.json nEvents / 2770401797).
lumi_pb: 33503

# preselection: as analysis.yaml with the J/psi veto window opened on the high side (2.90-3.20 instead of 2.9-3.3),
# the psi(2S) window 3.55-3.75 instead of 3.55-3.8, and the vertex cut at the table floor (vtxProb > 1e-3; vtxProb
# is a BDT feature). scripts/presel_variants.py with a BDT retrained per variant (report.md 2026-11-23): +15% signal,
# S/sqrt(B) +4-10% at BDT cuts 0.99-0.998.
preselection:
  vertex: "vtxProb > 1e-3"
  resonance veto: "not (dimu_mass > 0.97 and dimu_mass < 1.07) and not (dimu_mass > 2.90 and dimu_mass < 3.20) and not (dimu_mass > 3.55 and dimu_mass < 3.75)"

# extra columns from the v3 variables (merged with the derived columns of analysis.yaml)
derived:
  # isolation of the daughters with the B products removed (charged: tracks of the candidate's PV; neutral: PF
  # photons and neutral hadrons), absolute and relative to the daughter pt
  mu1Iso: "mu1IsoCh + mu1IsoNeu"
  mu2Iso: "mu2IsoCh + mu2IsoNeu"
  mu1IsoRel: "mu1Iso / mu1_pt"
  mu2IsoRel: "mu2Iso / mu2_pt"
  muIsoRel_max: "(mu1IsoRel + mu2IsoRel + abs(mu1IsoRel - mu2IsoRel)) / 2"
  muIsoRel_min: "(mu1IsoRel + mu2IsoRel - abs(mu1IsoRel - mu2IsoRel)) / 2"
  muIsoCh_max: "(mu1IsoCh + mu2IsoCh + abs(mu1IsoCh - mu2IsoCh)) / 2"
  muIsoNeu_max: "(mu1IsoNeu + mu2IsoNeu + abs(mu1IsoNeu - mu2IsoNeu)) / 2"
  phoIso: "phoIsoCh + phoIsoNeu"
  phoIsoRel: "phoIso / pho_pt"
  # muons used in the fit of the candidate's PV: 0, 1 or 2 (signal muons come from a displaced B)
  nMuInPV: "mu1InPV + mu2InPV"
  # activity of the candidate's PV without the candidate's tracks
  logPvSumPt: "log(pvSumPt + 1)"

# features: scripts/feature_study.py set r2_abs_pf (config/features_v3.yaml, report.md 2026-11-23): the v1 features
# with pho_mva replaced by the MVA without the muons, plus the daughter isolations without the B products, the PV
# activity and the standard PF isolations. Out-of-fold signal efficiency at sideband efficiency 2e-4: 0.43 (v1
# features on the same tables: 0.32); check_sculpting.py: no sign of sculpting.
bdt:
  features: [
    # vertex, flight and pointing
    vtxProb, cosAlpha3DVtxOnly, cosAlpha2D, logPointing, lxySig, l3dSig, ctSig, dimu_lxySig, dimu_cosAlphaBS, dimu_dca,
    # isolation of the candidate, of the daughters without the B products, standard PF isolations, PV activity
    isolation, maxTrackCompatibility, muIsoRel_max, muIsoRel_min, phoIsoRel, muIsoCh_max, muIsoNeu_max, phoIsoCh,
    phoIsoNeu, mu1_pfRelIsoR03, mu2_pfRelIsoR03, pho_pfIsoCharged, pho_pfIsoPhoton, pho_trkIsoR03, pvNTracks,
    logPvSumPt, pvVecSumPt,
    # muons
    mu1_pt, mu2_pt, mu1_mva, mu2_mva, mu_ipSig_min, mu_ipSig_max,
    # photon
    pho_pt, phoMvaNoMu, pho_r9, pho_sigmaIetaIeta, pho_sigmaIphiIphi, pho_hOverE, pho_scEtaWidth, pho_scPhiWidth,
    pho_energyErr, pho_hasConversionTracks, pho_absEta,
    # kinematics and angles of the decay
    dR_mumu_pho, dR_mu_pho_min, pho_ptFrac, pt, dimu_pt, absEta, helicity, abs_cosThetaL]

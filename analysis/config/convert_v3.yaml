# Configuration of convert.py for the v3 ntuples (2026-11-22 production: mmg, mmcg, mmgg; skim with
# vtxProb > 1e-3; new isolation, photon MVA without the muons, muon-PV association variables).
#
#   python3 convert.py config/convert_v3.yaml [--datasets NAME ...] [--workers 16]

# output directory
output: /eos/user/s/sslawins/bmmg/parquet_v3

# channels to convert (mmg, mmcg, mmgg, mmkk); channels absent from a file are skipped
channels: [mmg, mmcg, mmgg]

# loose preselection, a pandas query on the table columns (candidate variables without prefix,
# e.g. fitOK, vtxProb, mass; legs as mu1_pt, pho_mva, ...). Empty: keep every candidate.
preselection: "fitOK == 1 and vtxProb > 1e-3"

# columns not to store (glob patterns), e.g. ["*Err", "bs_*", "*_genDR"]. Event ids are always kept.
drop_columns: []

# maximal input files per output part (smaller chunks are used if needed to keep all workers busy),
# parallel processes, Parquet compression (zstd; falls back to lz4/snappy if pyarrow lacks it)
chunk_files: 200
workers: 16
compression: zstd

# datasets: name -> glob pattern(s) of the ntuple files (** is recursive), isMC, label (free text)
datasets:
  Parking2022:
    files: /eos/user/s/sslawins/bmmg_ntuples_v3/ParkingDoubleMuonLowMass*/**/bmmg_ntuple_*.root
    isMC: false
    label: "2022 data"

  BsToMuMuGamma_2022:
    files: /eos/user/s/sslawins/bmmg_ntuples_v3/BsTo2MuG_SoftQCD_TuneCP5_13p6TeV_pythia8-evtgen/**/bmmg_ntuple_*.root
    isMC: true
    label: "Bs -> mu mu gamma, Run3Summer22"

  BdToMuMuGamma_2022:
    files: /eos/user/s/sslawins/bmmg_ntuples_v3/BdTo2MuG_SoftQCD_TuneCP5_13p6TeV_pythia8-evtgen/**/bmmg_ntuple_*.root
    isMC: true
    label: "Bd -> mu mu gamma, Run3Summer22"

  BsToJPsiGamma_2022:
    files: /eos/user/s/sslawins/bmmg_ntuples_v3/BsToJPsiG-JPsiTo2Mu_SoftQCD_TuneCP5_13p6TeV_pythia8-evtgen/**/bmmg_ntuple_*.root
    isMC: true
    label: "Bs -> J/psi gamma, Run3Summer22"

  BsToPhiGamma_2022:
    files: /eos/user/s/sslawins/bmmg_ntuples_v3/BsToPhiG-PhiTo2Mu_SoftQCD_TuneCP5_13p6TeV_pythia8-evtgen/**/bmmg_ntuple_*.root
    isMC: true
    label: "Bs -> phi gamma, Run3Summer22"

  BsToJPsiPi0_2022:
    files: /eos/user/s/sslawins/bmmg_ntuples_v3/BsToJPsiPi0-JPsiTo2Mu-Pi0To2G_SoftQCD_TuneCP5_13p6TeV_pythia8-evtgen/**/bmmg_ntuple_*.root
    isMC: true
    label: "Bs -> J/psi pi0, Run3Summer22"

  BsToJPsiEta_2022:
    files: /eos/user/s/sslawins/bmmg_ntuples_v3/BsToJPsiEta-JPsiTo2Mu-EtaTo2G_SoftQCD_TuneCP5_13p6TeV_pythia8-evtgen/**/bmmg_ntuple_*.root
    isMC: true
    label: "Bs -> J/psi eta, Run3Summer22"

  BsToJPsiEtaPrime_2022:
    files: /eos/user/s/sslawins/bmmg_ntuples_v3/BsToJPsiEtaPrime-JPsiTo2Mu-EtaPrimeTo2G_SoftQCD_TuneCP5_13p6TeV_pythia8-evtgen/**/bmmg_ntuple_*.root
    isMC: true
    label: "Bs -> J/psi eta prime, Run3Summer22"

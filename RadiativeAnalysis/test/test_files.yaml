# Test input samples of the ntuplizer configs (runNtuplizer_cfg.py testSample=<name>).
#
# Each sample is keyed by a short name and has:
#   description  free text
#   isMC         true / false
#   dataFormat   AOD / MINIAOD
#   files        list of paths; glob patterns are allowed
#
# python3 RadiativeAnalysis/python/testFiles.py lists the samples.

bsmmg_aod:
  description: Bs to mu mu gamma MC AOD
  isMC: true
  dataFormat: AOD
  files:
    - /eos/user/s/sslawins/testing_mc/BsTo2MuG_aod.root

bsmmg_miniaod:
  description: Bs to mu mu gamma MC MINIAOD
  isMC: true
  dataFormat: MINIAOD
  files:
    - /eos/user/s/sslawins/testing_mc/BsTo2MuG_miniaod.root

bsmmg_aod_filtered:
  description: >-
    Bs to mu mu gamma MC AOD files, every event contains at least 2 reconstructed muons and
    a reconstructed photon, large sample to test if distributions are correct

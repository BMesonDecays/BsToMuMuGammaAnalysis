  files:
    - /eos/user/s/sslawins/filtered_BsToMuMuGamma_official/BsTo2MuG_SoftQCD_TuneCP5_13p6TeV_pythia8-evtgen/BsToMuMuGamma_official/261102_143603/0000/*.root

